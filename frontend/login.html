<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Healthy Future</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Top Navbar -->
  <nav class="navbar navbar-custom">
    <div class="container justify-content-center">
      <a class="navbar-brand navbar-brand-custom" href="index.html">
        <div class="brand-icon"><i class="bi bi-heart-pulse-fill"></i></div>
        <span>Healthy Future</span>
      </a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="bg-white rounded-4 border p-4 p-md-5 shadow-sm">
          <div class="text-center mb-4">
            <h2 class="fw-bold mb-1">Welcome Back</h2>
            <p class="text-muted small">Sign in to your Healthy Future account</p>
          </div>

          <!-- Quick Demo Role Switcher -->
          <div class="mb-4">
            <label class="small text-muted fw-bold d-block mb-2 text-center">Quick Demo Credentials:</label>
            <div class="d-flex gap-2 justify-content-center">
              <button type="button" class="btn btn-sm btn-outline-success rounded-pill" onclick="fillDemo('customer')">Customer</button>
              <button type="button" class="btn btn-sm btn-outline-primary rounded-pill" onclick="fillDemo('owner')">Hotel Owner</button>
              <button type="button" class="btn btn-sm btn-outline-dark rounded-pill" onclick="fillDemo('admin')">Admin</button>
            </div>
          </div>

          <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-3">
              <label class="form-label small fw-bold">Username or Email</label>
              <input type="text" id="login-username" class="form-control" placeholder="Enter username or email" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Password</label>
              <input type="password" id="login-password" class="form-control" placeholder="Enter password" required>
            </div>

            <button type="submit" id="btn-login-submit" class="btn btn-primary-custom w-100 py-2 rounded-pill fw-bold mb-3">
              Sign In <i class="bi bi-arrow-right ms-1"></i>
            </button>

            <div class="text-center small text-muted">
              Don't have an account? <a href="register.html" class="fw-bold text-success">Sign Up as Customer</a>
              <div class="mt-2">
                Are you a restaurant? <a href="owner/index.html" class="fw-bold text-primary">Partner Portal</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>

  <script>
    function fillDemo(role) {
      if (role === 'customer') {
        document.getElementById('login-username').value = 'boobesh';
        document.getElementById('login-password').value = 'User@12345';
      } else if (role === 'owner') {
        document.getElementById('login-username').value = 'healthyowner';
        document.getElementById('login-password').value = 'Owner@12345';
      } else if (role === 'admin') {
        document.getElementById('login-username').value = 'admin';
        document.getElementById('login-password').value = 'admin@123';
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const btn = document.getElementById('btn-login-submit');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Signing in...`;

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      const res = await Auth.login(username, password);

      if (res.success && res.data) {
        showToast('Login successful!', 'success');
        const user = res.data.user;
        const role = user.role || 'customer';

        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect');

        setTimeout(() => {
          if (role === 'admin') {
            window.location.href = 'admin/index.html';
          } else if (role === 'hotel_owner') {
            window.location.href = 'owner/index.html';
          } else {
            window.location.href = redirect || 'index.html';
          }
        }, 600);
      } else {
        showToast(res.message || 'Login failed. Please check credentials.', 'error');
        btn.disabled = false;
        btn.innerHTML = `Sign In <i class="bi bi-arrow-right ms-1"></i>`;
      }
    }

    // Auto fill based on URL parameter ?role=hotel_owner
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const role = urlParams.get('role');
      if (role === 'hotel_owner') fillDemo('owner');
      else if (role === 'admin') fillDemo('admin');
    });
  </script>
</body>
</html>
