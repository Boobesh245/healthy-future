<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Hotel Owners - Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-3 col-lg-2 portal-sidebar d-flex flex-column">
        <a href="index.html" class="portal-brand text-decoration-none">
          <i class="bi bi-shield-check"></i>
          <span>Admin Portal</span>
        </a>
        <div class="d-flex flex-column gap-1 mb-auto">
          <a href="index.html" class="portal-nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
          <a href="users.html" class="portal-nav-link"><i class="bi bi-people"></i>Customers</a>
          <a href="owners.html" class="portal-nav-link active"><i class="bi bi-person-badge"></i>Hotel Owners</a>
          <a href="restaurants.html" class="portal-nav-link"><i class="bi bi-shop"></i>Restaurants</a>
          <a href="categories.html" class="portal-nav-link"><i class="bi bi-tags"></i>Categories</a>
          <a href="foods.html" class="portal-nav-link"><i class="bi bi-egg-fried"></i>All Foods</a>
          <a href="orders.html" class="portal-nav-link"><i class="bi bi-receipt"></i>All Orders</a>
        </div>
        <div class="pt-4 border-top border-secondary">
          <a href="../index.html" class="portal-nav-link text-muted"><i class="bi bi-arrow-left"></i>View Website</a>
          <a href="javascript:void(0)" onclick="Auth.logout()" class="portal-nav-link text-danger"><i class="bi bi-box-arrow-right"></i>Sign Out</a>
        </div>
      </div>

      <div class="col-md-9 col-lg-10 p-4 p-md-5">
        <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-2">
          <div>
            <h1 class="h3 fw-bold mb-1">Hotel Owner Verifications</h1>
            <p class="text-muted mb-0">Approve, reject, or block restaurant owner partners</p>
          </div>
          <button class="btn btn-outline-custom rounded-pill btn-sm" onclick="loadOwners()">
            <i class="bi bi-arrow-clockwise me-1"></i>Refresh
          </button>
        </div>

        <div class="bg-white rounded-4 border shadow-sm overflow-hidden">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Owner ID</th>
                  <th>Username & Name</th>
                  <th>Contact Phone</th>
                  <th>Approval Status</th>
                  <th>Account State</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="admin-owners-tbody">
                <tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-success"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>

  <script>
    async function loadOwners() {
      if (!Auth.requireAuth(['admin'])) return;
      const res = await Api.get('/admin/owners/');
      const tbody = document.getElementById('admin-owners-tbody');

      if (!res.success || !res.data) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">${res.message || 'Error'}</td></tr>`;
        return;
      }

      const list = res.data;
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-muted">No hotel owners registered yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(o => {
        const u = o.user || {};
        let statusBadge = o.is_approved
          ? '<span class="badge bg-success-subtle text-success"><i class="bi bi-check-circle me-1"></i>Approved</span>'
          : '<span class="badge bg-warning-subtle text-warning-emphasis"><i class="bi bi-clock me-1"></i>Pending</span>';

        let stateBadge = o.is_blocked
          ? '<span class="badge bg-danger-subtle text-danger">Blocked</span>'
          : '<span class="badge bg-light text-dark border">Active</span>';

        return `
          <tr>
            <td class="text-muted small">#${o.id}</td>
            <td>
              <div class="fw-bold">${u.username || 'Partner'}</div>
              <div class="small text-muted">${u.first_name || ''} ${u.last_name || ''}</div>
            </td>
            <td>${o.phone || u.phone || '--'}</td>
            <td>${statusBadge}</td>
            <td>${stateBadge}</td>
            <td class="text-end">
              ${!o.is_approved ? `
                <button class="btn btn-sm btn-success rounded-pill me-1" onclick="performOwnerAction(${o.id}, 'approve')">
                  Approve
                </button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill me-1" onclick="performOwnerAction(${o.id}, 'reject')">
                  Reject
                </button>
              ` : ''}

              ${!o.is_blocked ? `
                <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="performOwnerAction(${o.id}, 'block')">
                  Block
                </button>
              ` : `
                <button class="btn btn-sm btn-outline-success rounded-pill" onclick="performOwnerAction(${o.id}, 'approve')">
                  Unblock
                </button>
              `}
            </td>
          </tr>
        `;
      }).join('');
    }

    async function performOwnerAction(ownerId, action) {
      const res = await Api.patch(`/admin/owners/${ownerId}/${action}/`, {});
      if (res.success) {
        showToast(res.message || `Action ${action} successful`, 'success');
        loadOwners();
      } else {
        showToast(res.message || 'Action failed', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadOwners);
  </script>
</body>
</html>
