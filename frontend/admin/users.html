<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users - Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-3 col-lg-2 portal-sidebar d-flex flex-column">
        <a href="index.html" class="portal-brand text-decoration-none">
          <i class="bi bi-shield-check"></i>
          <span>Admin Portal</span>
        </a>
        <div class="d-flex flex-column gap-1 mb-auto">
          <a href="index.html" class="portal-nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
          <a href="users.html" class="portal-nav-link active"><i class="bi bi-people"></i>Customers</a>
          <a href="owners.html" class="portal-nav-link"><i class="bi bi-person-badge"></i>Hotel Owners</a>
          <a href="restaurants.html" class="portal-nav-link"><i class="bi bi-shop"></i>Restaurants</a>
          <a href="categories.html" class="portal-nav-link"><i class="bi bi-tags"></i>Categories</a>
          <a href="foods.html" class="portal-nav-link"><i class="bi bi-egg-fried"></i>All Foods</a>
          <a href="orders.html" class="portal-nav-link"><i class="bi bi-receipt"></i>All Orders</a>
        </div>
        <div class="pt-4 border-top border-secondary">
          <a href="../index.html" class="portal-nav-link text-muted"><i class="bi bi-arrow-left"></i>View Website</a>
          <a href="javascript:void(0)" onclick="Auth.logout()" class="portal-nav-link text-danger"><i class="bi bi-box-arrow-right"></i>Sign Out</a>
        </div>
      </div>

      <div class="col-md-9 col-lg-10 p-4 p-md-5">
        <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-2">
          <div>
            <h1 class="h3 fw-bold mb-1">User & Customer Directory</h1>
            <p class="text-muted mb-0">100+ Customers registered across Hosur and Bangalore</p>
          </div>
          <div class="input-group" style="width: 250px;">
            <input type="text" id="user-search-input" class="form-control form-control-sm" placeholder="Search user..." onkeyup="filterUsersTable()">
          </div>
        </div>

        <div class="bg-white rounded-4 border shadow-sm overflow-hidden">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Username</th>
                  <th>Full Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>City</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="admin-users-tbody">
                <tr><td colspan="7" class="text-center py-5"><div class="spinner-border text-success"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>

  <script>
    let allUsers = [];

    async function loadAdminUsers() {
      if (!Auth.requireAuth(['admin'])) return;
      const res = await Api.get('/admin/users/');
      const tbody = document.getElementById('admin-users-tbody');

      if (!res.success || !res.data) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger">${res.message || 'Error'}</td></tr>`;
        return;
      }

      allUsers = res.data;
      renderUsers(allUsers);
    }

    function renderUsers(users) {
      const tbody = document.getElementById('admin-users-tbody');
      if (users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No users found.</td></tr>`;
        return;
      }

      tbody.innerHTML = users.map(u => {
        let roleBadge = '<span class="badge bg-success-subtle text-success">Customer</span>';
        if (u.role === 'admin') roleBadge = '<span class="badge bg-dark text-white">Admin</span>';
        else if (u.role === 'hotel_owner') roleBadge = '<span class="badge bg-primary-subtle text-primary">Hotel Owner</span>';

        return `
          <tr>
            <td class="text-muted small">#${u.id}</td>
            <td class="fw-bold">${u.username}</td>
            <td>${u.first_name || ''} ${u.last_name || ''}</td>
            <td class="small text-muted">${u.email || '--'}</td>
            <td>${roleBadge}</td>
            <td>${u.city || 'Hosur'}</td>
            <td class="text-end">
              ${u.role !== 'admin' ? `
                <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="deleteUser(${u.id}, '${u.username}')">
                  <i class="bi bi-trash"></i>
                </button>
              ` : '<span class="badge bg-light text-muted border">System</span>'}
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterUsersTable() {
      const q = document.getElementById('user-search-input').value.toLowerCase();
      const filtered = allUsers.filter(u => 
        (u.username && u.username.toLowerCase().includes(q)) ||
        (u.email && u.email.toLowerCase().includes(q)) ||
        (u.first_name && u.first_name.toLowerCase().includes(q)) ||
        (u.city && u.city.toLowerCase().includes(q))
      );
      renderUsers(filtered);
    }

    async function deleteUser(userId, username) {
      if (!confirm(`Are you sure you want to delete user "${username}"?`)) return;
      const res = await Api.delete(`/admin/users/${userId}/`);
      if (res.success) {
        showToast(`User ${username} deleted`, 'info');
        loadAdminUsers();
      } else {
        showToast(res.message || 'Delete failed', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadAdminUsers);
  </script>
</body>
</html>
