<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage All Foods - Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-3 col-lg-2 portal-sidebar d-flex flex-column">
        <a href="index.html" class="portal-brand text-decoration-none">
          <i class="bi bi-shield-check"></i>
          <span>Admin Portal</span>
        </a>
        <div class="d-flex flex-column gap-1 mb-auto">
          <a href="index.html" class="portal-nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
          <a href="users.html" class="portal-nav-link"><i class="bi bi-people"></i>Customers</a>
          <a href="owners.html" class="portal-nav-link"><i class="bi bi-person-badge"></i>Hotel Owners</a>
          <a href="restaurants.html" class="portal-nav-link"><i class="bi bi-shop"></i>Restaurants</a>
          <a href="categories.html" class="portal-nav-link"><i class="bi bi-tags"></i>Categories</a>
          <a href="foods.html" class="portal-nav-link active"><i class="bi bi-egg-fried"></i>All Foods</a>
          <a href="orders.html" class="portal-nav-link"><i class="bi bi-receipt"></i>All Orders</a>
        </div>
        <div class="pt-4 border-top border-secondary">
          <a href="../index.html" class="portal-nav-link text-muted"><i class="bi bi-arrow-left"></i>View Website</a>
          <a href="javascript:void(0)" onclick="Auth.logout()" class="portal-nav-link text-danger"><i class="bi bi-box-arrow-right"></i>Sign Out</a>
        </div>
      </div>

      <div class="col-md-9 col-lg-10 p-4 p-md-5">
        <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-2">
          <div>
            <h1 class="h3 fw-bold mb-1">Global Dish Catalog</h1>
            <p class="text-muted mb-0">720+ Certified healthy foods across all 60 restaurants</p>
          </div>
          <div class="input-group" style="width: 280px;">
            <input type="text" id="food-search-input" class="form-control form-control-sm" placeholder="Search dish or restaurant..." onkeyup="filterFoods()">
          </div>
        </div>

        <div class="bg-white rounded-4 border shadow-sm overflow-hidden">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th style="width: 60px;">Pic</th>
                  <th>Dish Name & Restaurant</th>
                  <th>Price</th>
                  <th>Calories</th>
                  <th>Protein</th>
                  <th>Tags</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th class="text-end">Action</th>
                </tr>
              </thead>
              <tbody id="admin-foods-tbody">
                <tr><td colspan="9" class="text-center py-5"><div class="spinner-border text-success"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>

  <script>
    let allFoods = [];

    async function loadAdminFoods() {
      if (!Auth.requireAuth(['admin'])) return;
      const res = await Api.get('/admin/foods/');
      const tbody = document.getElementById('admin-foods-tbody');

      if (!res.success || !res.data) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center py-4 text-danger">${res.message || 'Error'}</td></tr>`;
        return;
      }

      allFoods = res.data;
      renderTable(allFoods);
    }

    function renderTable(list) {
      const tbody = document.getElementById('admin-foods-tbody');
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center py-4 text-muted">No dishes found.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.slice(0, 100).map(f => `
        <tr>
          <td>
            <img src="${f.image || 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=60&q=80'}" class="rounded-3" style="width: 45px; height: 45px; object-fit: cover;">
          </td>
          <td>
            <div class="fw-bold">${f.food_name}</div>
            <div class="small text-muted"><i class="bi bi-shop me-1"></i>${f.restaurant_name}</div>
          </td>
          <td class="fw-bold">₹${f.price}</td>
          <td><span class="badge bg-danger-subtle text-danger">${f.calories} kcal</span></td>
          <td><span class="badge bg-success-subtle text-success">${f.protein}g</span></td>
          <td><span class="badge bg-light text-muted border">${(f.health_tags || '').split(',')[0]}</span></td>
          <td><span class="badge bg-light text-dark border">${f.food_type}</span></td>
          <td>
            <span class="badge ${f.availability ? 'bg-success' : 'bg-secondary'}">${f.availability ? 'Available' : 'Hidden'}</span>
          </td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="deleteFood(${f.id})">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function filterFoods() {
      const q = document.getElementById('food-search-input').value.toLowerCase();
      const filtered = allFoods.filter(f =>
        (f.food_name && f.food_name.toLowerCase().includes(q)) ||
        (f.restaurant_name && f.restaurant_name.toLowerCase().includes(q)) ||
        (f.health_tags && f.health_tags.toLowerCase().includes(q))
      );
      renderTable(filtered);
    }

    async function deleteFood(id) {
      if (!confirm('Are you sure you want to delete this food item?')) return;
      const res = await Api.delete(`/admin/foods/${id}/`);
      if (res.success) {
        showToast('Food deleted', 'info');
        loadAdminFoods();
      } else {
        showToast(res.message || 'Delete failed', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadAdminFoods);
  </script>
</body>
</html>
