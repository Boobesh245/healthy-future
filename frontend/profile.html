<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Healthy Future</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand navbar-brand-custom" href="index.html">
        <div class="brand-icon"><i class="bi bi-heart-pulse-fill"></i></div>
        <span>Healthy Future</span>
      </a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <div id="nav-auth-container"></div>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="bg-white rounded-4 border p-4 p-md-5 shadow-sm mb-4">
          <div class="d-flex align-items-center gap-3 pb-4 mb-4 border-bottom">
            <div class="brand-icon" style="width: 60px; height: 60px; font-size: 1.8rem;">
              <i class="bi bi-person-circle"></i>
            </div>
            <div>
              <h2 class="h4 fw-bold mb-1" id="profile-display-name">My Profile</h2>
              <span class="badge bg-success-subtle text-success fw-bold px-3 py-1 rounded-pill" id="profile-role">Customer</span>
            </div>
          </div>

          <form id="profile-form" onsubmit="handleUpdateProfile(event)">
            <h5 class="fw-bold mb-3 text-dark">Personal Information</h5>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold">First Name</label>
                <input type="text" id="prof-fname" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Last Name</label>
                <input type="text" id="prof-lname" class="form-control">
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold">Email</label>
                <input type="email" id="prof-email" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Phone Number</label>
                <input type="tel" id="prof-phone" class="form-control">
              </div>
            </div>

            <h5 class="fw-bold mb-3 mt-4 pt-3 border-top text-dark">Default Delivery Address</h5>
            <div class="mb-3">
              <label class="form-label small fw-bold">Address</label>
              <textarea id="prof-address" class="form-control" rows="2"></textarea>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label small fw-bold">City</label>
                <input type="text" id="prof-city" class="form-control" value="Hosur">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Pincode</label>
                <input type="text" id="prof-pincode" class="form-control" value="635109">
              </div>
            </div>

            <button type="submit" class="btn btn-primary-custom px-4 rounded-pill fw-bold">
              Save Profile Changes
            </button>
          </form>

          <!-- Password change -->
          <hr class="my-5">
          <h5 class="fw-bold mb-3 text-dark">Change Password</h5>
          <form id="pwd-form" onsubmit="handleChangePassword(event)">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold">Current Password</label>
                <input type="password" id="prof-old-pwd" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">New Password</label>
                <input type="password" id="prof-new-pwd" class="form-control" minlength="6" required>
              </div>
            </div>
            <button type="submit" class="btn btn-outline-custom px-4 rounded-pill fw-bold">
              Update Password
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>

  <script>
    async function loadProfile() {
      if (!Auth.requireAuth()) return;
      const res = await Api.get('/auth/profile/');
      if (res.success && res.data) {
        const u = res.data;
        document.getElementById('profile-display-name').textContent = `${u.first_name || ''} ${u.last_name || ''} (${u.username})`;
        document.getElementById('profile-role').textContent = u.role.toUpperCase();

        document.getElementById('prof-fname').value = u.first_name || '';
        document.getElementById('prof-lname').value = u.last_name || '';
        document.getElementById('prof-email').value = u.email || '';
        document.getElementById('prof-phone').value = u.phone || '';
        document.getElementById('prof-address').value = u.address || '';
        document.getElementById('prof-city').value = u.city || 'Hosur';
        document.getElementById('prof-pincode').value = u.pincode || '635109';
      }
    }

    async function handleUpdateProfile(event) {
      event.preventDefault();
      const payload = {
        first_name: document.getElementById('prof-fname').value.trim(),
        last_name: document.getElementById('prof-lname').value.trim(),
        email: document.getElementById('prof-email').value.trim(),
        phone: document.getElementById('prof-phone').value.trim(),
        address: document.getElementById('prof-address').value.trim(),
        city: document.getElementById('prof-city').value.trim(),
        pincode: document.getElementById('prof-pincode').value.trim()
      };

      const res = await Api.put('/auth/profile/', payload);
      if (res.success) {
        showToast('Profile updated successfully', 'success');
        if (res.data) localStorage.setItem('hf_user', JSON.stringify(res.data));
        Auth.updateNavUI();
      } else {
        showToast(res.message || 'Update failed', 'error');
      }
    }

    async function handleChangePassword(event) {
      event.preventDefault();
      const old_password = document.getElementById('prof-old-pwd').value;
      const new_password = document.getElementById('prof-new-pwd').value;

      const res = await Api.post('/auth/change-password/', { old_password, new_password });
      if (res.success) {
        showToast('Password changed successfully!', 'success');
        document.getElementById('pwd-form').reset();
      } else {
        showToast(res.message || 'Password update failed', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
