<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Restaurant - Healthy Future</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-3 col-lg-2 portal-sidebar d-flex flex-column">
        <a href="index.html" class="portal-brand text-decoration-none">
          <i class="bi bi-heart-pulse-fill"></i>
          <span>Partner Hub</span>
        </a>
        <div class="d-flex flex-column gap-1 mb-auto">
          <a href="index.html" class="portal-nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
          <a href="restaurant.html" class="portal-nav-link active"><i class="bi bi-shop"></i>My Restaurant</a>
          <a href="foods.html" class="portal-nav-link"><i class="bi bi-egg-fried"></i>Manage Dishes</a>
          <a href="orders.html" class="portal-nav-link"><i class="bi bi-receipt"></i>Live Orders</a>
        </div>
        <div class="pt-4 border-top border-secondary">
          <a href="../index.html" class="portal-nav-link text-muted"><i class="bi bi-arrow-left"></i>View Website</a>
          <a href="javascript:void(0)" onclick="Auth.logout()" class="portal-nav-link text-danger"><i class="bi bi-box-arrow-right"></i>Sign Out</a>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-md-9 col-lg-10 p-4 p-md-5">
        <h1 class="h3 fw-bold mb-4">Manage Restaurant Details</h1>

        <div class="bg-white rounded-4 border p-4 p-md-5 shadow-sm">
          <form id="rest-edit-form" onsubmit="handleSaveRestaurant(event)">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold">Restaurant Name</label>
                <input type="text" id="rest-name-input" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Cuisine Category</label>
                <input type="text" id="rest-cuisine-input" class="form-control" placeholder="e.g. Salads, High Protein, Organic" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Description</label>
              <textarea id="rest-desc-input" class="form-control" rows="2"></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Banner Image URL</label>
              <input type="url" id="rest-image-input" class="form-control" placeholder="https://...">
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold">Delivery Time (minutes)</label>
                <input type="number" id="rest-time-input" class="form-control" value="30" min="10" max="90" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Delivery Fee (₹)</label>
                <input type="number" id="rest-charge-input" class="form-control" value="30" min="0" step="5" required>
              </div>
            </div>

            <h5 class="fw-bold mb-3 mt-4 pt-3 border-top">Location & Contact</h5>
            <div class="mb-3">
              <label class="form-label small fw-bold">Street Address</label>
              <textarea id="rest-addr-input" class="form-control" rows="2" required></textarea>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-4">
                <label class="form-label small fw-bold">City</label>
                <input type="text" id="rest-city-input" class="form-control" value="Hosur" required>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-bold">Pincode</label>
                <input type="text" id="rest-pin-input" class="form-control" value="635109" required>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-bold">Phone Number</label>
                <input type="tel" id="rest-phone-input" class="form-control" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary-custom px-4 rounded-pill fw-bold">
              Save Restaurant Details
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>

  <script>
    async function loadRestaurant() {
      if (!Auth.requireAuth(['hotel_owner', 'admin'])) return;
      const res = await Api.get('/owner/restaurant/');
      if (res.success && res.data) {
        const r = res.data;
        document.getElementById('rest-name-input').value = r.name || '';
        document.getElementById('rest-cuisine-input').value = r.cuisine || '';
        document.getElementById('rest-desc-input').value = r.description || '';
        document.getElementById('rest-image-input').value = r.image || '';
        document.getElementById('rest-time-input').value = r.delivery_time || 30;
        document.getElementById('rest-charge-input').value = r.delivery_charge || 30;
        document.getElementById('rest-addr-input').value = r.address || '';
        document.getElementById('rest-city-input').value = r.city || 'Hosur';
        document.getElementById('rest-pin-input').value = r.pincode || '635109';
        document.getElementById('rest-phone-input').value = r.phone || '';
      }
    }

    async function handleSaveRestaurant(event) {
      event.preventDefault();
      const payload = {
        name: document.getElementById('rest-name-input').value.trim(),
        cuisine: document.getElementById('rest-cuisine-input').value.trim(),
        description: document.getElementById('rest-desc-input').value.trim(),
        image: document.getElementById('rest-image-input').value.trim(),
        delivery_time: document.getElementById('rest-time-input').value,
        delivery_charge: document.getElementById('rest-charge-input').value,
        address: document.getElementById('rest-addr-input').value.trim(),
        city: document.getElementById('rest-city-input').value.trim(),
        pincode: document.getElementById('rest-pin-input').value.trim(),
        phone: document.getElementById('rest-phone-input').value.trim(),
      };

      const res = await Api.put('/owner/restaurant/', payload);
      if (res.success) {
        showToast('Restaurant updated successfully!', 'success');
      } else {
        showToast(res.message || 'Update failed', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadRestaurant);
  </script>
</body>
</html>
