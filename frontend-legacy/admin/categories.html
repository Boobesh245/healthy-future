<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories - Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-3 col-lg-2 portal-sidebar d-flex flex-column">
        <a href="index.html" class="portal-brand text-decoration-none">
          <i class="bi bi-shield-check"></i>
          <span>Admin Portal</span>
        </a>
        <div class="d-flex flex-column gap-1 mb-auto">
          <a href="index.html" class="portal-nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
          <a href="users.html" class="portal-nav-link"><i class="bi bi-people"></i>Customers</a>
          <a href="owners.html" class="portal-nav-link"><i class="bi bi-person-badge"></i>Hotel Owners</a>
          <a href="restaurants.html" class="portal-nav-link"><i class="bi bi-shop"></i>Restaurants</a>
          <a href="categories.html" class="portal-nav-link active"><i class="bi bi-tags"></i>Categories</a>
          <a href="foods.html" class="portal-nav-link"><i class="bi bi-egg-fried"></i>All Foods</a>
          <a href="orders.html" class="portal-nav-link"><i class="bi bi-receipt"></i>All Orders</a>
        </div>
        <div class="pt-4 border-top border-secondary">
          <a href="../index.html" class="portal-nav-link text-muted"><i class="bi bi-arrow-left"></i>View Website</a>
          <a href="javascript:void(0)" onclick="Auth.logout()" class="portal-nav-link text-danger"><i class="bi bi-box-arrow-right"></i>Sign Out</a>
        </div>
      </div>

      <div class="col-md-9 col-lg-10 p-4 p-md-5">
        <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-2">
          <div>
            <h1 class="h3 fw-bold mb-1">Dietary Categories</h1>
            <p class="text-muted mb-0">Manage healthy food categories (13+ standard categories)</p>
          </div>
          <button class="btn btn-primary-custom rounded-pill" onclick="openAddCatModal()">
            <i class="bi bi-plus-lg me-1"></i>Add Category
          </button>
        </div>

        <div class="row g-4" id="admin-categories-container">
          <div class="col-12 text-center py-5"><div class="spinner-border text-success"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Category Modal -->
  <div class="modal fade" id="catModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold" id="catModalTitle">Add Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="cat-form" onsubmit="handleSaveCategory(event)">
            <input type="hidden" id="modal-cat-id">
            <div class="mb-3">
              <label class="form-label small fw-bold">Category Name</label>
              <input type="text" id="modal-cat-name" class="form-control" placeholder="e.g. Protein Meals" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Description</label>
              <textarea id="modal-cat-desc" class="form-control" rows="2"></textarea>
            </div>
            <div class="mb-4">
              <label class="form-label small fw-bold">Image URL</label>
              <input type="url" id="modal-cat-img" class="form-control" placeholder="https://...">
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 py-2 rounded-pill fw-bold">Save Category</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>

  <script>
    let catModalInstance = null;

    async function loadCategories() {
      if (!Auth.requireAuth(['admin'])) return;
      const res = await Api.get('/admin/categories/');
      const container = document.getElementById('admin-categories-container');

      if (!res.success || !res.data) {
        container.innerHTML = `<div class="col-12 text-danger text-center py-4">${res.message || 'Error'}</div>`;
        return;
      }

      const list = res.data;
      container.innerHTML = list.map(c => `
        <div class="col-sm-6 col-lg-4">
          <div class="bg-white rounded-4 border p-4 shadow-sm h-100 d-flex flex-column justify-content-between">
            <div class="d-flex align-items-center gap-3 mb-3">
              <img src="${c.image || 'https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=100&q=80'}" class="rounded-circle" style="width: 55px; height: 55px; object-fit: cover;">
              <div>
                <h5 class="fw-bold mb-0 text-dark">${c.name}</h5>
                <span class="badge bg-success-subtle text-success">${c.total_foods || 0} active dishes</span>
              </div>
            </div>
            <p class="text-muted small mb-3 flex-grow-1">${c.description || 'Nutritious dishes tailored for health enthusiasts.'}</p>
            <div class="d-flex justify-content-end gap-2 pt-2 border-top">
              <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="deleteCategory(${c.id})">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openAddCatModal() {
      document.getElementById('catModalTitle').textContent = 'Add Category';
      document.getElementById('cat-form').reset();
      document.getElementById('modal-cat-id').value = '';
      if (!catModalInstance) catModalInstance = new bootstrap.Modal(document.getElementById('catModal'));
      catModalInstance.show();
    }

    async function handleSaveCategory(event) {
      event.preventDefault();
      const catId = document.getElementById('modal-cat-id').value;
      const payload = {
        name: document.getElementById('modal-cat-name').value.trim(),
        description: document.getElementById('modal-cat-desc').value.trim(),
        image: document.getElementById('modal-cat-img').value.trim(),
      };

      const res = await Api.post('/admin/categories/', payload);
      if (res.success) {
        showToast('Category created!', 'success');
        catModalInstance.hide();
        loadCategories();
      } else {
        showToast(res.message || 'Creation failed', 'error');
      }
    }

    async function deleteCategory(id) {
      if (!confirm('Are you sure you want to delete this category?')) return;
      const res = await Api.delete(`/admin/categories/${id}/`);
      if (res.success) {
        showToast('Category deleted', 'info');
        loadCategories();
      } else {
        showToast(res.message || 'Delete failed', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadCategories);
  </script>
</body>
</html>
