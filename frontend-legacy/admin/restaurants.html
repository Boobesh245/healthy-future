<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Restaurants - Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-3 col-lg-2 portal-sidebar d-flex flex-column">
        <a href="index.html" class="portal-brand text-decoration-none">
          <i class="bi bi-shield-check"></i>
          <span>Admin Portal</span>
        </a>
        <div class="d-flex flex-column gap-1 mb-auto">
          <a href="index.html" class="portal-nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
          <a href="users.html" class="portal-nav-link"><i class="bi bi-people"></i>Customers</a>
          <a href="owners.html" class="portal-nav-link"><i class="bi bi-person-badge"></i>Hotel Owners</a>
          <a href="restaurants.html" class="portal-nav-link active"><i class="bi bi-shop"></i>Restaurants</a>
          <a href="categories.html" class="portal-nav-link"><i class="bi bi-tags"></i>Categories</a>
          <a href="foods.html" class="portal-nav-link"><i class="bi bi-egg-fried"></i>All Foods</a>
          <a href="orders.html" class="portal-nav-link"><i class="bi bi-receipt"></i>All Orders</a>
        </div>
        <div class="pt-4 border-top border-secondary">
          <a href="../index.html" class="portal-nav-link text-muted"><i class="bi bi-arrow-left"></i>View Website</a>
          <a href="javascript:void(0)" onclick="Auth.logout()" class="portal-nav-link text-danger"><i class="bi bi-box-arrow-right"></i>Sign Out</a>
        </div>
      </div>

      <div class="col-md-9 col-lg-10 p-4 p-md-5">
        <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-2">
          <div>
            <h1 class="h3 fw-bold mb-1">Restaurant Management</h1>
            <p class="text-muted mb-0">60+ Certified partner kitchens across Hosur & Bangalore</p>
          </div>
          <div class="input-group" style="width: 260px;">
            <input type="text" id="rest-search-input" class="form-control form-control-sm" placeholder="Search restaurant..." onkeyup="filterRestaurants()">
          </div>
        </div>

        <div class="bg-white rounded-4 border shadow-sm overflow-hidden">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th style="width: 60px;">Pic</th>
                  <th>Name & Cuisine</th>
                  <th>City</th>
                  <th>Dishes</th>
                  <th>Rating</th>
                  <th>Approval</th>
                  <th>Active</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="admin-restaurants-tbody">
                <tr><td colspan="8" class="text-center py-5"><div class="spinner-border text-success"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>

  <script>
    let allRestaurants = [];

    async function loadRestaurants() {
      if (!Auth.requireAuth(['admin'])) return;
      const res = await Api.get('/admin/restaurants/');
      const tbody = document.getElementById('admin-restaurants-tbody');

      if (!res.success || !res.data) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger">${res.message || 'Error'}</td></tr>`;
        return;
      }

      allRestaurants = res.data;
      renderTable(allRestaurants);
    }

    function renderTable(list) {
      const tbody = document.getElementById('admin-restaurants-tbody');
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-muted">No restaurants found.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(r => `
        <tr>
          <td>
            <img src="${r.image || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=60&q=80'}" class="rounded-3" style="width: 45px; height: 45px; object-fit: cover;">
          </td>
          <td>
            <div class="fw-bold">${r.name}</div>
            <div class="small text-muted">${r.cuisine}</div>
          </td>
          <td><i class="bi bi-geo-alt me-1 text-danger"></i>${r.city}</td>
          <td><span class="badge bg-light text-dark border">${r.total_foods || 12} dishes</span></td>
          <td><span class="badge bg-warning-subtle text-warning-emphasis"><i class="bi bi-star-fill text-warning me-1"></i>${r.rating}</span></td>
          <td>
            ${r.is_approved
              ? '<span class="badge bg-success-subtle text-success">Approved</span>'
              : '<span class="badge bg-warning-subtle text-warning-emphasis">Pending</span>'}
          </td>
          <td>
            ${r.is_active
              ? '<span class="badge bg-success">Active</span>'
              : '<span class="badge bg-secondary">Inactive</span>'}
          </td>
          <td class="text-end">
            ${!r.is_approved ? `
              <button class="btn btn-sm btn-success rounded-pill me-1" onclick="performRestAction(${r.id}, 'approve')">Approve</button>
            ` : ''}

            <button class="btn btn-sm ${r.is_active ? 'btn-outline-warning' : 'btn-outline-success'} rounded-pill me-1" onclick="performRestAction(${r.id}, '${r.is_active ? 'deactivate' : 'activate'}')">
              ${r.is_active ? 'Deactivate' : 'Activate'}
            </button>

            <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="deleteRestaurant(${r.id})">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function filterRestaurants() {
      const q = document.getElementById('rest-search-input').value.toLowerCase();
      const filtered = allRestaurants.filter(r =>
        (r.name && r.name.toLowerCase().includes(q)) ||
        (r.cuisine && r.cuisine.toLowerCase().includes(q)) ||
        (r.city && r.city.toLowerCase().includes(q))
      );
      renderTable(filtered);
    }

    async function performRestAction(restId, action) {
      const res = await Api.patch(`/admin/restaurants/${restId}/${action}/`, {});
      if (res.success) {
        showToast(res.message || `Restaurant ${action}d successfully`, 'success');
        loadRestaurants();
      } else {
        showToast(res.message || 'Action failed', 'error');
      }
    }

    async function deleteRestaurant(restId) {
      if (!confirm('Are you sure you want to delete this restaurant?')) return;
      const res = await Api.delete(`/admin/restaurants/${restId}/`);
      if (res.success) {
        showToast('Restaurant deleted', 'info');
        loadRestaurants();
      } else {
        showToast(res.message || 'Delete failed', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadRestaurants);
  </script>
</body>
</html>
