<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu - Healthy Future</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand navbar-brand-custom" href="index.html">
        <div class="brand-icon"><i class="bi bi-heart-pulse-fill"></i></div>
        <span>Healthy Future</span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-1 my-2 my-lg-0">
          <li class="nav-item"><a class="nav-link nav-link-custom" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="restaurants.html">Restaurants</a></li>
        </ul>

        <div class="d-flex align-items-center gap-3 ms-lg-4 mt-3 mt-lg-0">
          <a href="cart.html" class="cart-badge-btn text-decoration-none">
            <i class="bi bi-basket2-fill"></i>
            <span>Cart</span>
            <span class="cart-count">0</span>
          </a>
          <div id="nav-auth-container"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Restaurant Header Banner -->
  <div class="bg-white border-bottom py-4" id="restaurant-header">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-3 mb-3 mb-md-0">
          <img id="rest-img" src="" alt="Restaurant" class="img-fluid rounded-4 shadow-sm w-100" style="height: 180px; object-fit: cover;">
        </div>
        <div class="col-md-9">
          <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
            <h1 class="h2 fw-bold mb-0" id="rest-name">Loading Restaurant...</h1>
            <span class="badge bg-dark text-warning fs-6 px-3 py-1 rounded-pill" id="rest-rating">
              <i class="bi bi-star-fill"></i> --
            </span>
          </div>
          <p class="text-success fw-bold mb-1" id="rest-cuisine">Cuisine</p>
          <p class="text-muted small mb-2" id="rest-address"><i class="bi bi-geo-alt me-1"></i>Location</p>
          <div class="d-flex flex-wrap gap-4 text-muted small mt-3">
            <div><i class="bi bi-clock-fill text-success me-1"></i>Delivery: <strong class="text-dark" id="rest-time">30 mins</strong></div>
            <div><i class="bi bi-truck text-success me-1"></i>Delivery Fee: <strong class="text-dark" id="rest-delivery">₹30</strong></div>
            <div><i class="bi bi-telephone-fill text-success me-1"></i>Contact: <strong class="text-dark" id="rest-phone">--</strong></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Dishes Menu Section -->
  <div class="container py-5">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h2 class="h3 fw-bold mb-1">Nutrition-Packed Menu</h2>
        <p class="text-muted mb-0">Dishes with full macro breakdown prepared fresh to order</p>
      </div>
    </div>

    <!-- Dishes Container -->
    <div class="row" id="foods-container">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-success" role="status"></div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-custom">
    <div class="container text-center text-muted small">
      &copy; 2026 Healthy Future Web Application.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>

  <script>
    async function loadRestaurant() {
      const urlParams = new URLSearchParams(window.location.search);
      const restId = urlParams.get('id');

      if (!restId) {
        window.location.href = 'restaurants.html';
        return;
      }

      // Fetch restaurant details
      const restRes = await Api.get(`/restaurants/${restId}/`);
      if (!restRes.success || !restRes.data) {
        showToast('Restaurant not found', 'error');
        return;
      }

      const r = restRes.data;
      document.title = `${r.name} - Healthy Future`;
      document.getElementById('rest-name').textContent = r.name;
      document.getElementById('rest-cuisine').textContent = r.cuisine;
      document.getElementById('rest-address').innerHTML = `<i class="bi bi-geo-alt-fill text-danger me-1"></i>${r.address}, ${r.city} - ${r.pincode}`;
      document.getElementById('rest-rating').innerHTML = `<i class="bi bi-star-fill"></i> ${parseFloat(r.rating).toFixed(1)}`;
      document.getElementById('rest-time').textContent = `${r.delivery_time} mins`;
      document.getElementById('rest-delivery').textContent = parseFloat(r.delivery_charge) === 0 ? 'Free' : `₹${r.delivery_charge}`;
      document.getElementById('rest-phone').textContent = r.phone;
      document.getElementById('rest-img').src = r.image || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80';

      // Fetch restaurant foods
      const foodsRes = await Api.get(`/restaurants/${restId}/foods/`);
      const container = document.getElementById('foods-container');

      let list = [];
      if (foodsRes.results) list = foodsRes.results;
      else if (Array.isArray(foodsRes)) list = foodsRes;
      else if (foodsRes.data) list = foodsRes.data;

      if (!list || list.length === 0) {
        container.innerHTML = `
          <div class="col-12 text-center py-5">
            <p class="text-muted">No dishes currently available for this restaurant.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(f => renderFoodCard(f)).join('');
    }

    document.addEventListener('DOMContentLoaded', loadRestaurant);
  </script>
</body>
</html>
