<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Dishes - Hotel Owner Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-3 col-lg-2 portal-sidebar d-flex flex-column">
        <a href="index.html" class="portal-brand text-decoration-none">
          <i class="bi bi-heart-pulse-fill"></i>
          <span>Partner Hub</span>
        </a>
        <div class="d-flex flex-column gap-1 mb-auto">
          <a href="index.html" class="portal-nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
          <a href="restaurant.html" class="portal-nav-link"><i class="bi bi-shop"></i>My Restaurant</a>
          <a href="foods.html" class="portal-nav-link active"><i class="bi bi-egg-fried"></i>Manage Dishes</a>
          <a href="orders.html" class="portal-nav-link"><i class="bi bi-receipt"></i>Live Orders</a>
        </div>
        <div class="pt-4 border-top border-secondary">
          <a href="../index.html" class="portal-nav-link text-muted"><i class="bi bi-arrow-left"></i>View Website</a>
          <a href="javascript:void(0)" onclick="Auth.logout()" class="portal-nav-link text-danger"><i class="bi bi-box-arrow-right"></i>Sign Out</a>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-md-9 col-lg-10 p-4 p-md-5">
        <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-2">
          <div>
            <h1 class="h3 fw-bold mb-1">Dishes & Menu Management</h1>
            <p class="text-muted mb-0">Create, edit and manage food availability & macros</p>
          </div>
          <button class="btn btn-primary-custom rounded-pill" onclick="openAddFoodModal()">
            <i class="bi bi-plus-lg me-1"></i>Add New Dish
          </button>
        </div>

        <!-- Foods Table -->
        <div class="bg-white rounded-4 border shadow-sm overflow-hidden">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th style="width: 70px;">Dish</th>
                  <th>Name & Category</th>
                  <th>Price</th>
                  <th>Calories</th>
                  <th>Protein</th>
                  <th>Type</th>
                  <th>Available</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="owner-foods-tbody">
                <tr><td colspan="8" class="text-center py-5"><div class="spinner-border text-success"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add / Edit Food Modal -->
  <div class="modal fade" id="foodModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold" id="foodModalTitle">Add Healthy Dish</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="food-form" onsubmit="handleSaveFood(event)">
            <input type="hidden" id="modal-food-id">

            <div class="row g-3 mb-3">
              <div class="col-md-8">
                <label class="form-label small fw-bold">Dish Name</label>
                <input type="text" id="modal-food-name" class="form-control" placeholder="e.g. Avocado Quinoa Power Bowl" required>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-bold">Price (₹)</label>
                <input type="number" id="modal-food-price" class="form-control" placeholder="180" min="10" required>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label small fw-bold">Food Type</label>
                <select id="modal-food-type" class="form-select">
                  <option value="Veg">Vegetarian</option>
                  <option value="Non-Veg">Non-Vegetarian</option>
                  <option value="Vegan">Vegan</option>
                </select>
              </div>
              <div class="col-md-8">
                <label class="form-label small fw-bold">Health Tags (comma separated)</label>
                <input type="text" id="modal-food-tags" class="form-control" placeholder="High Protein, Keto, Sugar Free, Organic">
              </div>
            </div>

            <!-- Macro Fields -->
            <div class="row g-3 mb-3 p-3 bg-light rounded-3">
              <div class="col-3">
                <label class="form-label small fw-bold text-danger">Calories (kcal)</label>
                <input type="number" id="modal-food-cal" class="form-control form-control-sm" placeholder="320" required>
              </div>
              <div class="col-3">
                <label class="form-label small fw-bold text-success">Protein (g)</label>
                <input type="number" step="0.1" id="modal-food-prot" class="form-control form-control-sm" placeholder="24.0" required>
              </div>
              <div class="col-3">
                <label class="form-label small fw-bold text-primary">Carbs (g)</label>
                <input type="number" step="0.1" id="modal-food-carb" class="form-control form-control-sm" placeholder="30.0" required>
              </div>
              <div class="col-3">
                <label class="form-label small fw-bold text-warning">Fat (g)</label>
                <input type="number" step="0.1" id="modal-food-fat" class="form-control form-control-sm" placeholder="8.5" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Image URL</label>
              <input type="url" id="modal-food-image" class="form-control" placeholder="https://images.unsplash.com/...">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Description</label>
              <textarea id="modal-food-desc" class="form-control" rows="2" placeholder="Brief appetizing description..."></textarea>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-bold">Clean Ingredients</label>
              <textarea id="modal-food-ing" class="form-control" rows="2" placeholder="e.g. Quinoa, kale, cold-pressed olive oil, organic cherry tomatoes"></textarea>
            </div>

            <div class="form-check form-switch mb-4">
              <input class="form-check-input" type="checkbox" id="modal-food-avail" checked>
              <label class="form-check-label fw-bold small" for="modal-food-avail">Available for ordering</label>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 rounded-pill fw-bold">
              Save Dish
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>

  <script>
    let foodsModalInstance = null;

    async function loadOwnerFoods() {
      if (!Auth.requireAuth(['hotel_owner', 'admin'])) return;

      const res = await Api.get('/owner/foods/');
      const tbody = document.getElementById('owner-foods-tbody');

      if (!res.success || !res.data) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger">${res.message || 'Error'}</td></tr>`;
        return;
      }

      const list = res.data;
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-5 text-muted">No dishes added yet. Click "+ Add New Dish" above.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(f => `
        <tr>
          <td>
            <img src="${f.image || 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=80&q=80'}" class="rounded-3" style="width: 50px; height: 50px; object-fit: cover;">
          </td>
          <td>
            <div class="fw-bold text-dark">${f.food_name}</div>
            <div class="small text-muted">${f.category_name || 'Healthy Dish'}</div>
          </td>
          <td class="fw-bold">₹${f.price}</td>
          <td><span class="badge bg-danger-subtle text-danger">${f.calories} kcal</span></td>
          <td><span class="badge bg-success-subtle text-success">${f.protein}g</span></td>
          <td><span class="badge bg-light text-dark border">${f.food_type}</span></td>
          <td>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" ${f.availability ? 'checked' : ''} onchange="toggleFoodAvailability(${f.id}, this.checked)">
            </div>
          </td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary me-1 rounded-pill" onclick='openEditFoodModal(${JSON.stringify(f)})'>
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="deleteFood(${f.id})">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function openAddFoodModal() {
      document.getElementById('foodModalTitle').textContent = 'Add New Healthy Dish';
      document.getElementById('food-form').reset();
      document.getElementById('modal-food-id').value = '';
      document.getElementById('modal-food-avail').checked = true;

      if (!foodsModalInstance) {
        foodsModalInstance = new bootstrap.Modal(document.getElementById('foodModal'));
      }
      foodsModalInstance.show();
    }

    function openEditFoodModal(f) {
      document.getElementById('foodModalTitle').textContent = 'Edit Dish';
      document.getElementById('modal-food-id').value = f.id;
      document.getElementById('modal-food-name').value = f.food_name;
      document.getElementById('modal-food-price').value = f.price;
      document.getElementById('modal-food-type').value = f.food_type || 'Veg';
      document.getElementById('modal-food-tags').value = f.health_tags || '';
      document.getElementById('modal-food-cal').value = f.calories;
      document.getElementById('modal-food-prot').value = f.protein;
      document.getElementById('modal-food-carb').value = f.carbohydrates;
      document.getElementById('modal-food-fat').value = f.fat;
      document.getElementById('modal-food-image').value = f.image || '';
      document.getElementById('modal-food-desc').value = f.description || '';
      document.getElementById('modal-food-ing').value = f.ingredients || '';
      document.getElementById('modal-food-avail').checked = f.availability;

      if (!foodsModalInstance) {
        foodsModalInstance = new bootstrap.Modal(document.getElementById('foodModal'));
      }
      foodsModalInstance.show();
    }

    async function handleSaveFood(event) {
      event.preventDefault();
      const foodId = document.getElementById('modal-food-id').value;

      const payload = {
        food_name: document.getElementById('modal-food-name').value.trim(),
        price: document.getElementById('modal-food-price').value,
        food_type: document.getElementById('modal-food-type').value,
        health_tags: document.getElementById('modal-food-tags').value.trim(),
        calories: document.getElementById('modal-food-cal').value,
        protein: document.getElementById('modal-food-prot').value,
        carbohydrates: document.getElementById('modal-food-carb').value,
        fat: document.getElementById('modal-food-fat').value,
        image: document.getElementById('modal-food-image').value.trim(),
        description: document.getElementById('modal-food-desc').value.trim(),
        ingredients: document.getElementById('modal-food-ing').value.trim(),
        availability: document.getElementById('modal-food-avail').checked
      };

      let res;
      if (foodId) {
        res = await Api.put(`/owner/foods/${foodId}/`, payload);
      } else {
        res = await Api.post('/owner/foods/', payload);
      }

      if (res.success) {
        showToast(foodId ? 'Dish updated!' : 'Dish created!', 'success');
        foodsModalInstance.hide();
        loadOwnerFoods();
      } else {
        showToast(res.message || 'Error saving dish', 'error');
      }
    }

    async function toggleFoodAvailability(foodId, isAvailable) {
      const res = await Api.put(`/owner/foods/${foodId}/`, { availability: isAvailable });
      if (res.success) {
        showToast(`Availability updated to ${isAvailable ? 'available' : 'hidden'}`, 'info');
      }
    }

    async function deleteFood(foodId) {
      if (!confirm('Are you sure you want to remove this dish?')) return;
      const res = await Api.delete(`/owner/foods/${foodId}/`);
      if (res.success) {
        showToast('Dish deleted', 'info');
        loadOwnerFoods();
      } else {
        showToast(res.message || 'Delete failed', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadOwnerFoods);
  </script>
</body>
</html>
