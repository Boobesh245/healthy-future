<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Orders - Hotel Owner Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-3 col-lg-2 portal-sidebar d-flex flex-column">
        <a href="index.html" class="portal-brand text-decoration-none">
          <i class="bi bi-heart-pulse-fill"></i>
          <span>Partner Hub</span>
        </a>
        <div class="d-flex flex-column gap-1 mb-auto">
          <a href="index.html" class="portal-nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
          <a href="restaurant.html" class="portal-nav-link"><i class="bi bi-shop"></i>My Restaurant</a>
          <a href="foods.html" class="portal-nav-link"><i class="bi bi-egg-fried"></i>Manage Dishes</a>
          <a href="orders.html" class="portal-nav-link active"><i class="bi bi-receipt"></i>Live Orders</a>
        </div>
        <div class="pt-4 border-top border-secondary">
          <a href="../index.html" class="portal-nav-link text-muted"><i class="bi bi-arrow-left"></i>View Website</a>
          <a href="javascript:void(0)" onclick="Auth.logout()" class="portal-nav-link text-danger"><i class="bi bi-box-arrow-right"></i>Sign Out</a>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-md-9 col-lg-10 p-4 p-md-5">
        <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-2">
          <div>
            <h1 class="h3 fw-bold mb-1">Live Restaurant Orders</h1>
            <p class="text-muted mb-0">Manage incoming nutrition orders and update order status</p>
          </div>
          <button class="btn btn-outline-custom rounded-pill btn-sm" onclick="loadOwnerOrders()">
            <i class="bi bi-arrow-clockwise me-1"></i>Refresh
          </button>
        </div>

        <div class="row" id="owner-orders-container">
          <div class="col-12 text-center py-5">
            <div class="spinner-border text-success"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>

  <script>
    async function loadOwnerOrders() {
      if (!Auth.requireAuth(['hotel_owner', 'admin'])) return;

      const res = await Api.get('/owner/orders/');
      const container = document.getElementById('owner-orders-container');

      if (!res.success || !res.data) {
        container.innerHTML = `<div class="col-12 text-center py-5 text-muted">${res.message || 'Error loading orders'}</div>`;
        return;
      }

      const orders = res.data;
      if (orders.length === 0) {
        container.innerHTML = `
          <div class="col-12 text-center py-5 bg-white rounded-4 border">
            <i class="bi bi-inbox fs-1 text-muted"></i>
            <h4 class="mt-3">No Orders Yet</h4>
            <p class="text-muted">New incoming customer orders will appear here in real time.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = orders.map(o => {
        const statusSlug = (o.status || 'Pending').toLowerCase().replace(/\s+/g, '-');
        const formattedDate = new Date(o.created_at).toLocaleString('en-IN', {
          dateStyle: 'medium',
          timeStyle: 'short'
        });

        return `
          <div class="col-12 mb-4">
            <div class="bg-white rounded-4 border p-4 shadow-sm">
              <div class="d-flex flex-wrap align-items-center justify-content-between pb-3 mb-3 border-bottom gap-2">
                <div>
                  <span class="fw-bold fs-5 me-2">Order #${o.id}</span>
                  <span class="status-badge ${statusSlug}">${o.status}</span>
                </div>
                <div class="small text-muted">
                  <i class="bi bi-clock me-1"></i>${formattedDate}
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 border-end-md">
                  <h6 class="fw-bold text-muted small text-uppercase mb-2">Customer & Destination</h6>
                  <div class="fw-bold text-dark">${o.customer_name || o.customer_username}</div>
                  <div class="small text-muted mb-2"><i class="bi bi-telephone me-1"></i>${o.phone}</div>
                  <div class="small text-muted"><i class="bi bi-geo-alt me-1 text-danger"></i>${o.delivery_address}, ${o.city}</div>
                </div>

                <div class="col-md-6 mt-3 mt-md-0 d-flex flex-column justify-content-between">
                  <div>
                    <h6 class="fw-bold text-muted small text-uppercase mb-2">Items Ordered</h6>
                    <div class="d-flex flex-column gap-1 mb-3">
                      ${(o.items || []).map(i => `
                        <div class="d-flex justify-content-between small">
                          <span>${i.quantity}x ${i.food_name}</span>
                          <strong class="text-dark">₹${parseFloat(i.total_price).toFixed(2)}</strong>
                        </div>
                      `).join('')}
                    </div>
                  </div>

                  <div class="pt-3 border-top d-flex flex-wrap align-items-center justify-content-between gap-2">
                    <div>
                      <span class="small text-muted">Total: </span>
                      <strong class="text-success fs-5">₹${parseFloat(o.total).toFixed(2)}</strong>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                      <label class="small fw-bold text-nowrap">Status:</label>
                      <select class="form-select form-select-sm" style="width: 170px;" onchange="updateOrderStatus(${o.id}, this.value)">
                        <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                        <option value="Confirmed" ${o.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                        <option value="Preparing" ${o.status === 'Preparing' ? 'selected' : ''}>Preparing</option>
                        <option value="Out for Delivery" ${o.status === 'Out for Delivery' ? 'selected' : ''}>Out for Delivery</option>
                        <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                        <option value="Cancelled" ${o.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateOrderStatus(orderId, newStatus) {
      const res = await Api.patch(`/owner/orders/${orderId}/status/`, { status: newStatus });
      if (res.success) {
        showToast(`Order #${orderId} marked as ${newStatus}`, 'success');
        loadOwnerOrders();
      } else {
        showToast(res.message || 'Status update failed', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadOwnerOrders);
  </script>
</body>
</html>
