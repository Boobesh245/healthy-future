<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration - Healthy Future</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-custom">
    <div class="container justify-content-center">
      <a class="navbar-brand navbar-brand-custom" href="index.html">
        <div class="brand-icon"><i class="bi bi-heart-pulse-fill"></i></div>
        <span>Healthy Future</span>
      </a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="bg-white rounded-4 border p-4 p-md-5 shadow-sm">
          <div class="text-center mb-4">
            <h2 class="fw-bold mb-1">Create an Account</h2>
            <p class="text-muted small">Join Healthy Future for verified clean food delivery</p>
          </div>

          <form id="register-form" onsubmit="handleRegister(event)">
            <div class="row g-3 mb-3">
              <div class="col-sm-6">
                <label class="form-label small fw-bold">First Name</label>
                <input type="text" id="reg-fname" class="form-control" placeholder="Boobesh" required>
              </div>
              <div class="col-sm-6">
                <label class="form-label small fw-bold">Last Name</label>
                <input type="text" id="reg-lname" class="form-control" placeholder="D">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Username</label>
              <input type="text" id="reg-username" class="form-control" placeholder="boobesh_healthy" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Email Address</label>
              <input type="email" id="reg-email" class="form-control" placeholder="boobesh@example.com" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Phone Number</label>
              <input type="tel" id="reg-phone" class="form-control" placeholder="9876543210" required>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-sm-6">
                <label class="form-label small fw-bold">Password</label>
                <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
              </div>
              <div class="col-sm-6">
                <label class="form-label small fw-bold">Confirm Password</label>
                <input type="password" id="reg-password-confirm" class="form-control" placeholder="Repeat password" minlength="6" required>
              </div>
            </div>

            <button type="submit" id="btn-reg-submit" class="btn btn-primary-custom w-100 py-2 rounded-pill fw-bold mb-3">
              Register Now <i class="bi bi-person-check ms-1"></i>
            </button>

            <div class="text-center small text-muted">
              Already have an account? <a href="login.html" class="fw-bold text-success">Sign In</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>

  <script>
    async function handleRegister(event) {
      event.preventDefault();
      const pwd = document.getElementById('reg-password').value;
      const pwdConfirm = document.getElementById('reg-password-confirm').value;

      if (pwd !== pwdConfirm) {
        showToast('Passwords do not match', 'error');
        return;
      }

      const btn = document.getElementById('btn-reg-submit');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...`;

      const payload = {
        username: document.getElementById('reg-username').value.trim(),
        email: document.getElementById('reg-email').value.trim(),
        first_name: document.getElementById('reg-fname').value.trim(),
        last_name: document.getElementById('reg-lname').value.trim(),
        phone: document.getElementById('reg-phone').value.trim(),
        password: pwd,
        password_confirm: pwdConfirm
      };

      const res = await Auth.register(payload);

      if (res.success) {
        showToast('Registration successful! Welcome to Healthy Future.', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } else {
        const errDetail = res.errors ? Object.values(res.errors).flat().join(' ') : res.message;
        showToast(errDetail || 'Registration failed', 'error');
        btn.disabled = false;
        btn.innerHTML = `Register Now <i class="bi bi-person-check ms-1"></i>`;
      }
    }
  </script>
</body>
</html>
